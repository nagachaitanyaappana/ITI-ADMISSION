spring.application.name=backend
server.port=5050

spring.datasource.url=jdbc:postgresql://localhost:5432/ITIAP_LOCAL(2)
spring.datasource.username=postgres
spring.datasource.password=080908
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Swagger / OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Swagger UI ships a default "url" pointing at petstore.swagger.io inside
# swagger-initializer.js. When that url is present, Swagger UI loads it instead
# of rendering the module group dropdown produced by our GroupedOpenApi beans.
# Disabling it makes configUrl (/v3/api-docs/swagger-config) the only source,
# so the module selector (ITI, Admission Process, Student, ...) is used.
springdoc.swagger-ui.disable-swagger-default-url=true

# Open Swagger UI on the "All Modules" group instead of the alphabetically
# first one ("Admission Process"). That way every module section (ITI,
# Admission Process, Student, Merit & Checklist, ...) is visible on the page
# without having to pick it from the "Select a definition" dropdown first.
springdoc.swagger-ui.urls-primary-name=All Modules